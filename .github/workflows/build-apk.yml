name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../RashtraNiti3D.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RashtraNiti3D-Android-APK
          path: RashtraNiti3D.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: RashtraNiti 3D PM Simulator v1.1.0 (Playable APK)
          body: |
            ## 🇮🇳 RashtraNiti 3D PM Simulator - Playable Android APK
            
            **RashtraNiti 3D** is an Indian open-world political life simulator where you start as an ordinary citizen and rise to Ward Councilor, MLA, Chief Minister, and Prime Minister!
            
            ### 📥 Download & Install Instructions:
            1. Tap **RashtraNiti3D.apk** below to download directly to your Android device (no ZIP extraction needed!).
            2. Open the downloaded APK on your phone.
            3. If Google Play Protect asks, tap **More details -> Install anyway**.
            4. Enjoy your journey to the Prime Ministership of India!
          files: RashtraNiti3D.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
